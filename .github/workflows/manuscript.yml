name: manuscript

on:
  push:
    paths:
      - "publications/manuscript/**"
      - "publications/workshop/**"
      - ".github/workflows/manuscript.yml"
  pull_request:
    paths:
      - "publications/manuscript/**"
      - "publications/workshop/**"
      - ".github/workflows/manuscript.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install TeX packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science
      - name: Generate workshop figures
        run: python scripts/generate_paper_figures.py
      - name: Compile manuscript
        working-directory: publications/manuscript
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error conflux_fourth_year_2026.tex
      - name: Retain compiled manuscript
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conflux-fourth-year-manuscript
          path: publications/manuscript/conflux_fourth_year_2026.pdf
          retention-days: 14

      - name: Compile workshop paper
        working-directory: publications/workshop
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error conflux_workshop.tex

      - name: Retain compiled workshop paper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conflux-workshop-paper
          path: publications/workshop/conflux_workshop.pdf
          retention-days: 14
