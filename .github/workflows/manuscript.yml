name: manuscript

on:
  push:
    paths:
      - "manuscript/**"
      - ".github/workflows/manuscript.yml"
  pull_request:
    paths:
      - "manuscript/**"
      - ".github/workflows/manuscript.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science
      - name: Compile manuscript
        working-directory: manuscript
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error conflux_fourth_year_2026.tex
      - uses: actions/upload-artifact@v4
        with:
          name: conflux-fourth-year-manuscript
          path: manuscript/conflux_fourth_year_2026.pdf
