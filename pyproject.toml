[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "conflux"
version = "0.1.0"
description = "A provenance-aware authorisation architecture for LLM-based systems."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Raya Buckley" }
]
keywords = [
    "llm",
    "security",
    "authorisation",
    "provenance",
    "agent",
    "prompt-injection",
]
dependencies = [
    "jsonschema>=4.23",
    "PyYAML>=6.0.2",
]
[project.optional-dependencies]
openai-compatible = [
    "httpx>=0.27",
]
verification = [
    "z3-solver>=4.13",
]
local-model = [
    "accelerate>=1.0",
    "torch>=2.4",
    "transformers>=4.45",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "types-jsonschema>=4.23",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
[tool.ruff]
line-length = 140
target-version = "py312"
[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
[tool.mypy]
python_version = "3.12"
strict = true
[tool.setuptools]
package-dir = { "" = "src" }
[tool.setuptools.packages.find]
where = ["src"]
