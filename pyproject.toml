[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "conflux"
version = "0.1.0"
description = "A provenance-aware authorisation architecture for LLM-based systems."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Raya Buckley" }
]
keywords = [
    "llm",
    "security",
    "authorisation",
    "provenance",
    "agent",
    "prompt-injection",
]
dependencies = [
    "jsonschema>=4.23",
    "PyYAML>=6.0.2",
]
[project.scripts]
conflux = "conflux.cli:main"
[project.optional-dependencies]
openai-compatible = [
    "httpx>=0.27",
]
verification = [
    "z3-solver>=4.13",
]
agentdojo = [
    "agentdojo==0.1.35",
]
local-model = [
    "accelerate>=1.0",
    "torch>=2.4",
    "transformers>=4.45",
]
 dev = [
     "setuptools>=69",
     "wheel",
     "pytest>=8.0",
     "pytest-cov>=5.0",
     "ruff>=0.5",
     "mypy>=1.10",
     "build>=1.2",
     "types-jsonschema>=4.23",
     "types-PyYAML>=6.0.12",
     "hypothesis>=6.100",
     "yamllint>=1.35",
     "pip-audit>=2.7",
     "vulture>=2.11",
 ]
docs = [
    "pdoc>=15",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --basetemp=.local/pytest"
markers = [
    "security: security invariant tests",
    "integration: cross-boundary integration tests",
    "adapter: external adapter contract tests",
    "reproducibility: deterministic regeneration tests",
    "slow: tests that take >1s",
    "mutation: mutation killing tests",
]
[tool.coverage.run]
branch = true
source = ["conflux"]
omit = [
    "*/conflux/adapters/benchmarks/agentdojo_v1.py",
    "*/conflux/adapters/benchmarks/agentdojo_local.py",
    "*/conflux/adapters/models/local_transformers.py",
    "*/conflux/adapters/models/openai_compatible.py",
    "*/conflux/adapters/models/openai_compatible_planner.py",
    "*/conflux/adapters/providers/code_sandbox.py",
    "*/conflux/experiments/laptop_smoke.py",
    "*/conflux/experiments/planning_runner.py",
    "*/conflux/planning/verify.py",
    "*/conflux/verification/nuxmv_backend.py",
    "*/conflux/verification/z3_backend.py",
]
[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["reports/archive", "build", ".local"]

