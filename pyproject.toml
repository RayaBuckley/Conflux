[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "conflux"
version = "0.1.0"
description = "A provenance-aware authorisation architecture for LLM-based systems."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Raya Buckley" }
]
keywords = [
    "llm",
    "security",
    "authorisation",
    "provenance",
    "agent",
    "prompt-injection",
]
dependencies = [
    "jsonschema>=4.23",
    "PyYAML>=6.0.2",
]
[project.scripts]
conflux = "conflux.cli:main"
[project.optional-dependencies]
openai-compatible = [
    "httpx>=0.27",
]
verification = [
    "z3-solver>=4.13",
]
agentdojo = [
    "agentdojo==0.1.35",
]
local-model = [
    "accelerate>=1.0",
    "torch>=2.4",
    "transformers>=4.45",
]
dev = [
    "setuptools>=69",
    "wheel",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "types-jsonschema>=4.23",
    "types-PyYAML>=6.0.12",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --basetemp=.local/pytest"
[tool.coverage.run]
branch = true
source = ["src/conflux"]
omit = [
    "src/conflux/adapters/benchmarks/agentdojo_v1.py",
    "src/conflux/adapters/benchmarks/agentdojo_local.py",
    "src/conflux/adapters/models/huggingface.py",
    "src/conflux/adapters/models/openai_compatible.py",
    "src/conflux/adapters/models/openai_compatible_planner.py",
    "src/conflux/adapters/providers/code_sandbox.py",
    "src/conflux/verification/nuxmv_backend.py",
    "src/conflux/verification/z3_backend.py",
]
[tool.ruff]
line-length = 140
target-version = "py312"
[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
[tool.mypy]
python_version = "3.12"
strict = true
[tool.setuptools]
package-dir = { "" = "src" }
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.data-files]
"share/conflux/schemas" = ["schemas/*.json"]
"share/conflux/experiments" = ["experiments/suites/planning-diagnostic-v1.yaml"]
"share/conflux/experiments/baselines" = ["experiments/baselines/sled-historical-v1.json"]
"share/conflux/experiments/suites/canonical" = ["experiments/suites/canonical/*.yaml"]
"share/conflux/experiments/suites/legacy-reproduction" = ["experiments/suites/legacy-reproduction/*.yaml"]
