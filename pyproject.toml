[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "ANN", "D", "ARG", "SLF001", "PT", "INP001", "FBT003"]
"scripts/**/*.py" = ["S101", "S603", "S607", "T201", "PLR2004", "ANN", "D", "BLE001"]
"src/conflux/cli.py" = ["T201", "PLR2004", "PLC0415", "S603", "S607"]
"src/conflux/verification/nuxmv_backend.py" = ["S603", "S607", "S108"]
"src/conflux/adapters/providers/code_sandbox.py" = ["S603", "S108"]
"src/conflux/adapters/policy/cedar.py" = ["S603"]
"scripts/vulture_whitelist.py" = ["B018", "F821"]
[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["build/", "scripts/vulture_whitelist\\.py", "reports/archive/"]
[[tool.mypy.overrides]]
module = ["agentdojo.*", "transformers.*", "torch", "bitsandbytes", "httpx", "z3", "z3.*", "pdoc", "pdoc.*"]
ignore_missing_imports = true
[tool.setuptools]
package-dir = { "" = "src" }
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.data-files]
"share/conflux/schemas" = ["schemas/*.json"]
"share/conflux/experiments" = ["experiments/suites/planning-diagnostic-v1.yaml"]
"share/conflux/experiments/baselines" = ["experiments/baselines/sled-historical-v1.json"]
"share/conflux/experiments/suites/canonical" = ["experiments/suites/canonical/*.yaml"]
"share/conflux/experiments/suites/legacy-reproduction" = ["experiments/suites/legacy-reproduction/*.yaml"]
